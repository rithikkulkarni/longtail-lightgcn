[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longtail-lightgcn"
version = "0.1.0"
description = "Popularity-bias interventions for LightGCN on MovieLens-1M"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "requests",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]
figures = ["matplotlib"]  # scripts/make_figures.py and scripts/make_method_figure.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
